name: CI

on:
  push:
    branches:
      - development
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-tests:
    name: Deterministic localhost tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libcereal-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            liburiparser-dev \
            pkg-config

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCODA_BUILD_LIVE_NETWORK_TESTS=OFF \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure -V 2>&1 | tee net-test.log

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: net-test-diagnostics
          path: net-test.log
          if-no-files-found: error

  coverage:
    name: Target-local deterministic coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install dependencies and coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libcereal-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            liburiparser-dev \
            lcov \
            pkg-config

      - name: Configure coverage
        run: |
          cmake -S . -B build-coverage \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCODA_BUILD_LIVE_NETWORK_TESTS=OFF \
            -DENABLE_COVERAGE=ON \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build coverage targets
        run: cmake --build build-coverage --parallel 2

      - name: Generate coverage report
        run: cmake --build build-coverage --target coda_net_coverage

      - name: Verify coverage report
        run: test -f build-coverage/coverage/index.html
